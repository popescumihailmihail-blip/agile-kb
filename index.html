        <circle cx="16" cy="16" r="13" stroke="url(#lg)" stroke-width="2.4"/>

<!-- ===================== HERO ===================== -->
<section class="hero">
  <div class="wrap">
    <div class="hero-copy">
      <div class="eyebrow" data-i18n="hero.eyebrow"></div>
      <h1><span data-i18n="hero.title1"></span> <span class="grad-text" data-i18n="hero.title2"></span></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="cta">
        <a class="btn primary" href="#library" data-i18n="hero.cta1"></a>
        <a class="btn ghost" href="#playbooks" data-i18n="hero.cta2"></a>
      </div>
      <div class="hero-stats">
        <div class="s"><b>23</b><span data-i18n="hero.stat_books"></span></div>
        <div class="s"><b>368</b><span data-i18n="hero.stat_terms"></span></div>
        <div class="s"><b>8</b><span data-i18n="hero.stat_playbooks"></span></div>
        <div class="s"><b>3</b><span data-i18n="hero.stat_langs"></span></div>
      </div>
    </div>
    <div class="hero-visual">
      <svg class="orbit" viewBox="0 0 500 420" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="ga" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38e8ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
          <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5cc8"/><stop offset="1" stop-color="#ffc24b"/></linearGradient>
        </defs>
        <circle class="ring" cx="250" cy="210" r="170"/>
        <circle class="ring" cx="250" cy="210" r="120"/>
        <circle class="ring" cx="250" cy="210" r="70"/>
        <g class="spin">
          <circle class="arc" cx="250" cy="210" r="170" stroke="url(#ga)" stroke-dasharray="220 850"/>
          <circle class="node" cx="420" cy="210" r="9" fill="#38e8ff"/>
        </g>
        <g class="spin rev">
          <circle class="arc" cx="250" cy="210" r="120" stroke="url(#gb)" stroke-dasharray="150 600"/>
          <circle class="node" cx="130" cy="210" r="7" fill="#ff5cc8"/>
        </g>
        <g class="spin" style="animation-duration:12s">
          <circle class="arc" cx="250" cy="210" r="70" stroke="#7c5cff" stroke-dasharray="90 350"/>
          <circle class="node" cx="320" cy="210" r="6" fill="#7c5cff"/>
        </g>
        <circle cx="250" cy="210" r="34" fill="url(#ga)" class="pulse"/>
        <circle cx="250" cy="210" r="34" fill="none" stroke="#fff" stroke-opacity=".25"/>
        <text x="250" y="216" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" fill="#0b0d1a">Aⁿ</text>
      </svg>
    </div>
  </div>
</section>
